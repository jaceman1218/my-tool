<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my-tool</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #f2f3f5;
    --muted: #9aa1ac;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .logo { font-weight: 700; letter-spacing: 0.02em; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 24px;
    font-size: 14px;
  }
  nav a:hover { color: var(--text); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0 0 16px;
  }
  p.lead {
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }
  .cta {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 12px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }
  .cta:hover { opacity: 0.85; }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    max-width: 800px;
    margin: 56px auto 0;
    width: 100%;
  }
  .feature {
    background: var(--card);
    border-radius: 10px;
    padding: 20px;
    text-align: left;
  }
  .feature h3 { margin: 0 0 8px; font-size: 16px; }
  .feature p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">my-tool</div>
    <nav>
      <a href="#features">Features</a>
      <a href="#">Docs</a>
    </nav>
  </header>

  <main>
    <h1>Hello Vercel</h1>
    <p class="lead">
      my-tool はシンプルさを保ったまま、あなたのワークフローを加速するためのツールです。
    </p>
    <a class="cta" href="#">Get Started</a>

    <div class="features" id="features">
      <div class="feature">
        <h3>シンプル</h3>
        <p>余計な設定は不要。すぐに使い始められます。</p>
      </div>
      <div class="feature">
        <h3>軽量</h3>
        <p>必要最低限の機能だけを詰め込みました。</p>
      </div>
      <div class="feature">
        <h3>拡張可能</h3>
        <p>あなたのプロジェクトに合わせて自由に拡張できます。</p>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 my-tool
  </footer>
</body>
</html>
